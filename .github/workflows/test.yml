name: Bootstrap tests

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile engine
        run: python -m compileall -q bootstrap.py engine
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Self-detect
        run: python bootstrap.py detect . > /tmp/bootstrap-detect.json
      - name: CLI help
        run: |
          python bootstrap.py --version
          python bootstrap.py baseline --help
          python bootstrap.py policy-check --help
          python bootstrap.py memory-add --help
